<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .node      { fill: #ffffff; stroke: #cbd5e1; }
    .pill      { fill: #eef2ff; stroke: #c7d2fe; }
    .label     { fill: #1e293b; font-size: 14px; }
    .mono      { fill: #334155; font-size: 12px; font-family: ui-monospace, 'Cascadia Code', Menlo, monospace; }
    .msg       { fill: #334155; font-size: 13px; }
    .accenttxt { fill: #4338ca; font-size: 13px; }
    .flow      { stroke: #94a3b8; }
    .life      { stroke: #cbd5e1; }
    .flowhead  { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .node      { fill: #0b1220; stroke: #3b4a61; }
      .pill      { fill: #26264d; stroke: #4b4b8f; }
      .label     { fill: #e2e8f0; }
      .mono      { fill: #cbd5e1; }
      .msg       { fill: #cbd5e1; }
      .accenttxt { fill: #c7d2fe; }
      .flow      { stroke: #64748b; }
      .life      { stroke: #3b4a61; }
      .flowhead  { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="flowhead"/>
    </marker>
  </defs>

  <!-- lifelines -->
  <line x1="150" y1="68" x2="150" y2="480" class="life" stroke-dasharray="5 5"/>
  <line x1="440" y1="68" x2="440" y2="480" class="life" stroke-dasharray="5 5"/>
  <line x1="730" y1="68" x2="730" y2="480" class="life" stroke-dasharray="5 5"/>

  <!-- actors -->
  <rect x="70"  y="30" width="160" height="38" rx="10" class="node"/>
  <text x="150" y="54" text-anchor="middle" class="label">💻 laptop</text>
  <rect x="360" y="30" width="160" height="38" rx="10" class="node"/>
  <text x="440" y="54" text-anchor="middle" class="label">🖥️ zxc-pc</text>
  <rect x="650" y="30" width="160" height="38" rx="10" class="node"/>
  <text x="730" y="54" text-anchor="middle" class="label">🖱️ mouse · event8</text>

  <!-- 1: connect -->
  <text x="295" y="100" text-anchor="middle" class="msg">TCP connect · tailnet :8763</text>
  <line x1="150" y1="108" x2="434" y2="108" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2: spawn (self) -->
  <path d="M 440 138 H 505 Q 512 138 512 145 V 158 Q 512 165 505 165 H 448"
        fill="none" class="flow" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="524" y="156" class="mono">spawn zxc-mouse@conn.service</text>

  <!-- 3: grab -->
  <text x="585" y="197" text-anchor="middle" class="mono">open + EVIOCGRAB</text>
  <line x1="440" y1="205" x2="724" y2="205" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- note: dead -->
  <rect x="620" y="225" width="220" height="36" rx="10" class="pill"/>
  <text x="730" y="248" text-anchor="middle" class="accenttxt">mouse goes dead on zxc-pc</text>

  <!-- 4: stream -->
  <text x="440" y="292" text-anchor="middle" class="msg">event stream → uinput clone</text>
  <line x1="730" y1="300" x2="156" y2="300" class="flow" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- 5: disconnect -->
  <text x="295" y="340" text-anchor="middle" class="msg">disconnect — stop, suspend, link drop</text>
  <line x1="150" y1="348" x2="434" y2="348" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 6: exit (self) -->
  <path d="M 440 378 H 505 Q 512 378 512 385 V 398 Q 512 405 505 405 H 448"
        fill="none" class="flow" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="524" y="396" class="mono">instance exits</text>

  <!-- note: released -->
  <rect x="610" y="430" width="240" height="36" rx="10" class="pill"/>
  <text x="730" y="453" text-anchor="middle" class="accenttxt">grab released — mouse is back</text>
</svg>
