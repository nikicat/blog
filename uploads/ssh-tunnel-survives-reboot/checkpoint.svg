<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" role="img" aria-label="Time sequence of checkpointing and restoring a live SSH connection: the checkpointer installs a packet filter, freezes the process, reads socket state through TCP_REPAIR, writes images to disk, kills the process, and later restores it — while the peer only sees an unanswered retransmit.">
  <style>
    .node      { fill: #ffffff; stroke: #cbd5e1; }
    .hdr       { fill: #334155; font-size: 13px; font-weight: 600; }
    .label     { fill: #1e293b; font-size: 12px; }
    .mono      { fill: #1e293b; font-size: 11.5px; font-family: ui-monospace, 'Cascadia Code', Menlo, monospace; }
    .muted     { fill: #64748b; font-size: 11.5px; }
    .life      { stroke: #cbd5e1; }
    .flow      { stroke: #94a3b8; }
    .accent    { stroke: #6366f1; }
    .accenttxt { fill: #4338ca; font-size: 12px; font-weight: 600; }
    .band      { fill: #f1f5f9; stroke: #e2e8f0; }
    .hot       { stroke: #e11d48; }
    .hottxt    { fill: #e11d48; font-size: 12px; font-weight: 600; }
    .flowhead  { fill: #94a3b8; }
    .accenthead{ fill: #6366f1; }
    .hothead   { fill: #e11d48; }
    @media (prefers-color-scheme: dark) {
      .node      { fill: #0b1220; stroke: #3b4a61; }
      .hdr       { fill: #cbd5e1; }
      .label     { fill: #e2e8f0; }
      .mono      { fill: #e2e8f0; }
      .muted     { fill: #8fa3bb; }
      .life      { stroke: #3b4a61; }
      .flow      { stroke: #64748b; }
      .accent    { stroke: #818cf8; }
      .accenttxt { fill: #c7d2fe; }
      .band      { fill: #16202e; stroke: #2c3a4f; }
      .hot       { stroke: #fb7185; }
      .hottxt    { fill: #fb7185; }
      .flowhead  { fill: #64748b; }
      .accenthead{ fill: #818cf8; }
      .hothead   { fill: #fb7185; }
    }
  </style>
  <defs>
    <marker id="cp-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="flowhead"/>
    </marker>
    <marker id="cp-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="accenthead"/>
    </marker>
    <marker id="cp-h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="hothead"/>
    </marker>
  </defs>

  <rect x="40" y="24" width="170" height="36" rx="8" class="node"/>
  <text x="125" y="47" text-anchor="middle" class="hdr">checkpointer</text>
  <rect x="300" y="24" width="170" height="36" rx="8" class="node"/>
  <text x="385" y="47" text-anchor="middle" class="hdr">ssh process</text>
  <rect x="560" y="24" width="170" height="36" rx="8" class="node"/>
  <text x="645" y="47" text-anchor="middle" class="hdr">client kernel</text>
  <rect x="890" y="24" width="170" height="36" rx="8" class="node"/>
  <text x="975" y="47" text-anchor="middle" class="hdr">peer (sshd)</text>

  <line x1="125" y1="60" x2="125" y2="612" class="life" stroke-width="1.5"/>
  <line x1="385" y1="60" x2="385" y2="300" class="life" stroke-width="1.5"/>
  <line x1="385" y1="300" x2="385" y2="470" class="life" stroke-width="1.5" stroke-dasharray="3 5"/>
  <line x1="385" y1="470" x2="385" y2="612" class="life" stroke-width="1.5"/>
  <line x1="645" y1="60" x2="645" y2="612" class="life" stroke-width="1.5"/>
  <line x1="975" y1="60" x2="975" y2="612" class="life" stroke-width="1.5"/>

  <line x1="125" y1="96" x2="639" y2="96" class="accent" stroke-width="1.8" marker-end="url(#cp-aa)"/>
  <text x="135" y="88" class="accenttxt">install packet filter: drop everything to and from the peer</text>

  <line x1="125" y1="136" x2="379" y2="136" class="flow" stroke-width="1.5" marker-end="url(#cp-a)"/>
  <text x="135" y="128" class="label">freeze the process</text>

  <line x1="125" y1="176" x2="639" y2="176" class="flow" stroke-width="1.5" marker-end="url(#cp-a)"/>
  <text x="135" y="168" class="mono">TCP_REPAIR</text>
  <text x="215" y="168" class="label">— read sequence numbers and queues</text>

  <line x1="379" y1="216" x2="131" y2="216" class="flow" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cp-a)"/>
  <text x="150" y="208" class="label">memory pages — session keys included</text>

  <line x1="639" y1="252" x2="131" y2="252" class="flow" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#cp-a)"/>
  <text x="150" y="244" class="label">socket state</text>

  <line x1="368" y1="291" x2="402" y2="309" class="hot" stroke-width="2.2"/>
  <line x1="402" y1="291" x2="368" y2="309" class="hot" stroke-width="2.2"/>
  <text x="415" y="305" class="hottxt">process killed — everything now lives in files on disk</text>

  <rect x="60" y="330" width="1000" height="120" rx="10" class="band"/>
  <text x="80" y="354" class="hdr">the gap — seconds, or minutes, or a reboot</text>
  <line x1="969" y1="390" x2="700" y2="390" class="flow" stroke-width="1.5" marker-end="url(#cp-a)"/>
  <line x1="678" y1="381" x2="696" y2="399" class="hot" stroke-width="2"/>
  <line x1="696" y1="381" x2="678" y2="399" class="hot" stroke-width="2"/>
  <text x="712" y="382" class="muted">peer retransmits, filter swallows it</text>
  <line x1="969" y1="426" x2="700" y2="426" class="flow" stroke-width="1.5" marker-end="url(#cp-a)"/>
  <line x1="678" y1="417" x2="696" y2="435" class="hot" stroke-width="2"/>
  <line x1="696" y1="417" x2="678" y2="435" class="hot" stroke-width="2"/>
  <text x="712" y="418" class="muted">again, backing off exponentially</text>

  <line x1="125" y1="484" x2="379" y2="484" class="flow" stroke-width="1.5" marker-end="url(#cp-a)"/>
  <text x="135" y="476" class="label">recreate the process, same pid</text>

  <line x1="125" y1="524" x2="639" y2="524" class="flow" stroke-width="1.5" marker-end="url(#cp-a)"/>
  <text x="135" y="516" class="mono">TCP_REPAIR</text>
  <text x="215" y="516" class="label">— write the old sequence numbers and queues back</text>

  <line x1="125" y1="562" x2="639" y2="562" class="accent" stroke-width="1.8" marker-end="url(#cp-aa)"/>
  <text x="135" y="554" class="accenttxt">remove the packet filter</text>

  <line x1="651" y1="598" x2="969" y2="598" class="flow" stroke-width="1.5" marker-end="url(#cp-a)" marker-start="url(#cp-a)"/>
  <text x="810" y="590" text-anchor="middle" class="label">traffic resumes — the peer never saw a disconnect</text>
</svg>
