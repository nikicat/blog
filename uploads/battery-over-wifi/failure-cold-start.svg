<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .surface   { fill: #f8fafc; stroke: #e2e8f0; }
    .node      { fill: #ffffff; stroke: #cbd5e1; }
    .title     { fill: #334155; font-size: 15px; font-weight: 600; }
    .lane      { fill: #64748b; font-size: 12px; font-weight: 600; }
    .label     { fill: #1e293b; font-size: 13px; }
    .mono      { fill: #1e293b; font-size: 12px; font-family: ui-monospace, 'Cascadia Code', Menlo, monospace; }
    .muted     { fill: #64748b; font-size: 12px; }
    .flow      { stroke: #94a3b8; fill: none; }
    .flowhead  { fill: #94a3b8; }
    .badbox    { fill: #fef2f2; stroke: #fecaca; }
    .badtxt    { fill: #b91c1c; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
    .okbox     { fill: #ecfdf5; stroke: #a7f3d0; }
    .oktxt     { fill: #047857; font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
    .emptybox  { fill: none; stroke: #cbd5e1; stroke-dasharray: 5 4; }
    .accentbox { fill: #eef2ff; stroke: #c7d2fe; }
    .accenttxt { fill: #4338ca; font-size: 13px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .surface   { fill: #16202e; stroke: #2c3a4f; }
      .node      { fill: #0b1220; stroke: #3b4a61; }
      .title     { fill: #cbd5e1; }
      .lane      { fill: #8fa3bb; }
      .label     { fill: #e2e8f0; }
      .mono      { fill: #e2e8f0; }
      .muted     { fill: #8fa3bb; }
      .flow      { stroke: #64748b; }
      .flowhead  { fill: #64748b; }
      .badbox    { fill: #2a1618; stroke: #7f2b31; }
      .badtxt    { fill: #fca5a5; }
      .okbox     { fill: #0f2a22; stroke: #2f6f5a; }
      .oktxt     { fill: #6ee7b7; }
      .emptybox  { stroke: #3b4a61; }
      .accentbox { fill: #26264d; stroke: #4b4b8f; }
      .accenttxt { fill: #c7d2fe; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="flowhead"/>
    </marker>
  </defs>
  <text x="20" y="26" class="title">Cold start — zxc-pc unreachable, or the mouse is off</text>
  <text x="20" y="60" class="lane">uhid-hidpp-battery</text>
  <rect x="20" y="70" width="96" height="40" rx="8" class="node"/>
  <text x="68" y="94" class="mono" text-anchor="middle">start</text>
  <rect x="140" y="70" width="200" height="40" rx="8" class="badbox"/>
  <text x="240" y="86.5" class="badtxt" text-anchor="middle">fetch → Errno 111</text>
  <text x="240" y="101.5" class="badtxt" text-anchor="middle">connection refused</text>
  <rect x="364" y="70" width="96" height="40" rx="8" class="badbox"/>
  <text x="412" y="94" class="badtxt" text-anchor="middle">exit 1</text>
  <rect x="484" y="70" width="180" height="40" rx="8" class="node"/>
  <text x="574" y="86.5" class="label" text-anchor="middle">retry ladder</text>
  <text x="574" y="101.5" class="mono" text-anchor="middle">5s → 60s, forever</text>
  <rect x="688" y="70" width="172" height="40" rx="8" class="okbox"/>
  <text x="774" y="86.5" class="oktxt" text-anchor="middle">fetch ✓ 4057 mV</text>
  <text x="774" y="101.5" class="oktxt" text-anchor="middle">device created</text>
  <path d="M116,90 H136" class="flow" marker-end="url(#a)"/>
  <path d="M340,90 H360" class="flow" marker-end="url(#a)"/>
  <path d="M460,90 H480" class="flow" marker-end="url(#a)"/>
  <path d="M664,90 H684" class="flow" marker-end="url(#a)"/>
  <path d="M574,114 V128 H412 V114" class="flow" marker-end="url(#a)"/>
  <text x="20" y="180" class="lane">Settings → Power</text>
  <rect x="20" y="190" width="644" height="44" rx="8" class="emptybox"/>
  <text x="342" y="216" class="muted" text-anchor="middle">no mouse listed — nothing is published without a reading</text>
  <rect x="688" y="190" width="172" height="44" rx="8" class="accentbox"/>
  <text x="774" y="216" class="accenttxt" text-anchor="middle">mouse — 88%</text>
  <path d="M676,212 H684" class="flow" marker-end="url(#a)"/>
</svg>
