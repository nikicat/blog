<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .surface   { fill: #f8fafc; stroke: #e2e8f0; }
    .node      { fill: #ffffff; stroke: #cbd5e1; }
    .pill      { fill: #eef2ff; stroke: #c7d2fe; }
    .label     { fill: #1e293b; font-size: 13px; }
    .host      { fill: #64748b; font-size: 12px; font-weight: 600; }
    .mono      { fill: #334155; font-size: 11px; font-family: ui-monospace, 'Cascadia Code', Menlo, monospace; }
    .msg       { fill: #334155; font-size: 12px; }
    .accenttxt { fill: #4338ca; font-size: 12px; }
    .flow      { stroke: #94a3b8; }
    .life      { stroke: #cbd5e1; }
    .flowhead  { fill: #94a3b8; }
    @media (prefers-color-scheme: dark) {
      .surface   { fill: #16202e; stroke: #2c3a4f; }
      .node      { fill: #0b1220; stroke: #3b4a61; }
      .pill      { fill: #26264d; stroke: #4b4b8f; }
      .label     { fill: #e2e8f0; }
      .host      { fill: #8fa3bb; }
      .mono      { fill: #cbd5e1; }
      .msg       { fill: #cbd5e1; }
      .accenttxt { fill: #c7d2fe; }
      .flow      { stroke: #64748b; }
      .life      { stroke: #3b4a61; }
      .flowhead  { fill: #64748b; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="flowhead"/>
    </marker>
  </defs>

  <!-- host boundaries -->
  <rect x="34"  y="20" width="542" height="560" rx="14" class="surface"/>
  <text x="50"  y="40" class="host">💻 laptop</text>
  <rect x="606" y="20" width="238" height="560" rx="14" class="surface"/>
  <text x="622" y="40" class="host">🖥️ zxc-pc — ARM board</text>

  <!-- lifelines -->
  <line x1="150" y1="98" x2="150" y2="570" class="life" stroke-dasharray="5 5"/>
  <line x1="440" y1="98" x2="440" y2="570" class="life" stroke-dasharray="5 5"/>
  <line x1="725" y1="98" x2="725" y2="570" class="life" stroke-dasharray="5 5"/>
  <line x1="990" y1="98" x2="990" y2="570" class="life" stroke-dasharray="5 5"/>

  <!-- actors -->
  <rect x="50"  y="54" width="200" height="40" rx="10" class="node"/>
  <text x="150" y="79" text-anchor="middle" class="mono">hid-logitech-hidpp</text>
  <rect x="340" y="54" width="200" height="40" rx="10" class="node"/>
  <text x="440" y="79" text-anchor="middle" class="mono">uhid-hidpp-battery</text>
  <rect x="625" y="54" width="200" height="40" rx="10" class="node"/>
  <text x="725" y="79" text-anchor="middle" class="mono">hidpp-battery-query</text>
  <rect x="890" y="54" width="200" height="40" rx="10" class="node"/>
  <text x="990" y="79" text-anchor="middle" class="label">🖱️ the mouse</text>

  <!-- 1: poll -->
  <text x="583" y="126" text-anchor="middle" class="msg">poll · tcp 8764, tailnet</text>
  <line x1="440" y1="134" x2="719" y2="134" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2: ask the mouse -->
  <text x="858" y="168" text-anchor="middle" class="mono">HID++ 0x1001 · hidraw → 2.4 GHz</text>
  <line x1="725" y1="176" x2="984" y2="176" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3: voltage back -->
  <text x="858" y="210" text-anchor="middle" class="msg">4057 mV</text>
  <line x1="990" y1="218" x2="731" y2="218" class="flow" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- 4: json back -->
  <text x="583" y="252" text-anchor="middle" class="mono">{"voltage_mv": 4057}</text>
  <line x1="725" y1="260" x2="446" y2="260" class="flow" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- 5: only now is a device created -->
  <text x="295" y="302" text-anchor="middle" class="mono">UHID_CREATE2 — virtual BT mouse</text>
  <line x1="440" y1="310" x2="156" y2="310" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 6..9: the interrogation -->
  <text x="295" y="350" text-anchor="middle" class="msg">who are you? · feature 0x0005</text>
  <line x1="150" y1="358" x2="434" y2="358" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="295" y="392" text-anchor="middle" class="msg">G502 LIGHTSPEED Wireless Gaming Mouse</text>
  <line x1="440" y1="400" x2="156" y2="400" class="flow" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <text x="295" y="434" text-anchor="middle" class="msg">battery? · feature 0x1001</text>
  <line x1="150" y1="442" x2="434" y2="442" class="flow" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="295" y="476" text-anchor="middle" class="msg">4057 mV — from cache, never forwarded</text>
  <line x1="440" y1="484" x2="156" y2="484" class="flow" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#a)"/>

  <!-- 10: publish (self) -->
  <path d="M 150 508 H 215 Q 222 508 222 515 V 528 Q 222 535 215 535 H 158"
        fill="none" class="flow" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="234" y="527" class="mono">publish hidpp_battery_N</text>

  <!-- note -->
  <rect x="50" y="548" width="240" height="32" rx="10" class="pill"/>
  <text x="170" y="569" text-anchor="middle" class="accenttxt">UPower → GNOME: mouse, 88%</text>
</svg>
