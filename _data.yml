home:
  welcome: Hi, I'm Nikolay Bryskin. I debug things until they confess, then write it down.

menu_links: []
extra_head:
  - '<script defer src="https://nikicat-umami.fly.dev/script.js" data-website-id="2f348616-00b4-43c7-958c-76fcbc78ea5b"></script>'
  - |
    <style>
      .post-cover { width: 100%; border-radius: 8px; margin: 1.5rem 0 0; }
      .post-thumb { float: right; width: 10rem; margin: 0.25rem 0 0.75rem 1.25rem; }
      .post-thumb img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; }
      @media (max-width: 450px) { .post-thumb { width: 6.5rem; } }
      .site-footer { text-align: center; margin: 3rem 0 1rem; }
      .site-footer a { font-size: 0.7rem; opacity: 0.2; color: inherit; text-decoration: none; }
      .site-footer a:hover, .site-footer a:focus-visible { opacity: 0.8; }

      /* Syntax highlighting. Prism themes are single-mode, so these are the
         house palette in both directions: light defaults, dark under the media
         query for OS-dark readers, and dark again under [data-theme=dark] so
         the manual toggle wins either way. */
      :root {
        --tok-comment: #64748b; --tok-keyword: #6d28d9; --tok-string: #0f766e;
        --tok-number:  #b45309; --tok-func:    #2563eb; --tok-class:  #0369a1;
        --tok-builtin: #0891b2; --tok-punct:   #64748b; --tok-deco:   #e11d48;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme=light]) {
          --tok-comment: #8fa3bb; --tok-keyword: #c4b5fd; --tok-string: #5eead4;
          --tok-number:  #fcd34d; --tok-func:    #93c5fd; --tok-class:  #7dd3fc;
          --tok-builtin: #67e8f9; --tok-punct:   #94a3b8; --tok-deco:   #fb7185;
        }
      }
      :root[data-theme=dark] {
        --tok-comment: #8fa3bb; --tok-keyword: #c4b5fd; --tok-string: #5eead4;
        --tok-number:  #fcd34d; --tok-func:    #93c5fd; --tok-class:  #7dd3fc;
        --tok-builtin: #67e8f9; --tok-punct:   #94a3b8; --tok-deco:   #fb7185;
      }
      .token.comment, .token.prolog, .token.cdata, .token.doctype {
        color: var(--tok-comment); font-style: italic; }
      .token.keyword, .token.boolean, .token.atrule, .token.important, .token.selector {
        color: var(--tok-keyword); }
      .token.string, .token.char, .token.attr-value, .token.regex, .token.inserted, .token.triple-quoted-string {
        color: var(--tok-string); }
      .token.number, .token.constant, .token.symbol { color: var(--tok-number); }
      .token.function, .token.attr-name { color: var(--tok-func); }
      .token.class-name, .token.tag, .token.property { color: var(--tok-class); }
      .token.builtin, .token.variable, .token.parameter { color: var(--tok-builtin); }
      .token.punctuation, .token.operator { color: var(--tok-punct); }
      .token.decorator, .token.annotation, .token.deleted { color: var(--tok-deco); }
      .token.namespace { opacity: 0.7; }
    </style>

